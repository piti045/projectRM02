<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Translation</title>
    <style>
        :root {
            --bg: #10161d;
            --panel: rgba(19, 28, 38, 0.86);
            --line: rgba(255, 255, 255, 0.16);
            --text: #eef5ff;
            --muted: #a9bad0;
            --ok: #53f0a2;
            --warn: #ffb36a;
            --accent: #6bc5ff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            color: var(--text);
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at 15% 20%, #1f3346 0%, #111821 44%, #090d12 100%);
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .top-actions {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .top-actions a {
            text-decoration: none;
            color: #0d1a26;
            background: #8ad8ff;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 700;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(1.08) contrast(1.02);
        }

        .panel {
            position: absolute;
            top: 18px;
            left: 18px;
            width: min(520px, calc(100% - 36px));
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 16px;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        .title {
            margin: 0 0 8px;
            font-size: 18px;
            letter-spacing: 0.4px;
        }

        .row {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 8px;
            padding: 4px 0;
            align-items: baseline;
        }

        .label {
            color: var(--muted);
            font-size: 13px;
        }

        .value {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }

        .sub {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
        }

        .sentence {
            font-size: 17px;
            min-height: 24px;
        }

        .confidence {
            color: var(--ok);
        }

        .tts-panel {
            position: absolute;
            right: 18px;
            bottom: 18px;
            width: min(360px, calc(100% - 36px));
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
        }

        .tts-title {
            margin: 0 0 8px;
            font-size: 14px;
            color: var(--muted);
        }

        .control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .control input[type="range"] {
            width: 100%;
        }

        .tts-status {
            margin: 0;
            font-size: 13px;
            color: var(--warn);
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="stage">
        <img src="{{ url_for('video_feed') }}" id="video" alt="video stream">

        <div class="panel">
            <h1 class="title">Realtime Sign Translation</h1>
            <div class="row">
                <div class="label">Word</div>
                <div class="value" id="word">-</div>
            </div>
            <div class="row">
                <div class="label">Meaning</div>
                <div class="value sub" id="meaning">-</div>
            </div>
            <div class="row">
                <div class="label">Sentence</div>
                <div class="value sentence" id="sentence">-</div>
            </div>
            <div class="row">
                <div class="label">Confidence</div>
                <div class="value confidence" id="confidence">0.00</div>
            </div>
            <div class="row">
                <div class="label">Camera</div>
                <div class="value sub" id="camera-mode">Normal</div>
            </div>
        </div>

        <div class="tts-panel">
            <p class="tts-title">Text to Speech</p>
            <label class="control" for="tts-enabled">
                <input id="tts-enabled" type="checkbox" checked>
                Auto speak when sentence ends
            </label>
            <label class="control" for="tts-rate">
                Speed
                <input id="tts-rate" type="range" min="0.7" max="1.3" step="0.05" value="1.0">
            </label>
            <p class="tts-status" id="tts-status">TTS ready</p>
        </div>

        <div class="top-actions">
            <a href="/calibration">Calibration</a>
        </div>
    </div>

    <script>
        const wordEl = document.getElementById('word');
        const meaningEl = document.getElementById('meaning');
        const sentenceEl = document.getElementById('sentence');
        const confidenceEl = document.getElementById('confidence');
        const cameraModeEl = document.getElementById('camera-mode');
        const ttsEnabledEl = document.getElementById('tts-enabled');
        const ttsRateEl = document.getElementById('tts-rate');
        const ttsStatusEl = document.getElementById('tts-status');

        let lastFinalPhraseAt = 0;

        function setText(el, text) {
            el.textContent = text || '-';
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                ttsStatusEl.textContent = 'Browser does not support TTS';
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = Number(ttsRateEl.value || 1);
            utterance.lang = 'th-TH';

            utterance.onend = () => {
                ttsStatusEl.textContent = 'TTS ready';
            };
            utterance.onerror = () => {
                ttsStatusEl.textContent = 'TTS error';
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();

                setText(wordEl, data.prediction);
                setText(meaningEl, data.meaning);
                setText(sentenceEl, data.sentence);
                confidenceEl.textContent = Number(data.confidence || 0).toFixed(2);
                cameraModeEl.textContent = data.camera_mirror ? 'Mirror' : 'Normal';

                const finalPhraseAt = Number(data.final_phrase_at || 0);
                const finalPhrase = String(data.final_phrase || '').trim();
                if (ttsEnabledEl.checked && finalPhrase && finalPhraseAt > lastFinalPhraseAt) {
                    ttsStatusEl.textContent = `Speaking: ${finalPhrase}`;
                    speakText(finalPhrase);
                    lastFinalPhraseAt = finalPhraseAt;
                }
            } catch (e) {
                // keep last values
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 250);
    </script>
</body>
</html>
